# Repository agent/generator plus a local Qwen3 judge.
# Set generators.reader.options to your vision-capable model server before running.
[agent]
type = "longmemeval_v2"
[agent.options]
domain = "enterprise"
memory_context_max_tokens = 200000
processor_path = "Qwen/Qwen3.5-9B"

[generators.reader]
type = "openai_compatible"
[generators.reader.options]
model = "Qwen/Qwen3-8B"
base_url = "http://localhost:8001/v1"
api_key_env = "READER_API_KEY"
[agent.generation]
generator = "reader"

[agent.generation.settings]
max_tokens = 20000
temperature = 0.6
top_p = 0.95
[agent.generation.settings.extra_body]
top_k = 20

[generators.judge]
type = "openai_compatible"
[generators.judge.options]
model = "Qwen/Qwen3-8B"
base_url = "http://localhost:8001/v1"
api_key_env = "READER_API_KEY"

[[benchmarks]]
type = "longmemeval_v2"
[benchmarks.options]
data_root = "data/longmemeval-v2"
domain = "enterprise"
tier = "small"
# limit = 5  # Development subset; remove for a complete domain run.
[benchmarks.generation]
generator = "judge"
[benchmarks.generation.settings]
max_tokens = 512
temperature = 0.0

[[memories]]
type = "none"
