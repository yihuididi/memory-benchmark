[project]
name = "memory-bench"
version = "0.1.0"
description = "A modular harness for comparing memory architectures across benchmarks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
openai-compatible = ["openai>=1.100,<3", "pydantic>=2.10,<3"]
local-transformers = [
    "outlines>=1.2,<2", "transformers>=4.57,<6", "torch>=2.6,<3",
    "accelerate>=1.2,<2", "pydantic>=2.10,<3", "Pillow>=11,<13",
]
transformers-vision = ["transformers>=5.2,<6", "torchvision>=0.21,<1", "Pillow>=11,<13"]

[project.scripts]
memory-bench = "memory_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pydantic>=2.10,<3"]

[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
